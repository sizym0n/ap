<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESign • DNS HSBC</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0f1115;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 22px;
      border-radius: 24px;
      background: #191c22;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
    }
    .icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #252a33;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }
    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
    }
    .subtitle {
      margin: 8px 0 26px;
      color: #aeb4c0;
      font-size: 15px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: opacity 0.15s ease;
    }
    .button:active {
      opacity: 0.7;
    }
    .install {
      background: #007aff;
      color: white;
    }
    .download {
      background: #292e38;
      color: white;
    }
    .note {
      margin-top: 22px;
      color: #858c99;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✍️</div>
    <h1>ESign</h1>
    <div class="subtitle">
      DNS • HSBC Bank
    </div>
    <!-- EXACT AppleJr HSBC installation URL -->
    <a
      class="button install"
      href="itms-services://?action=download-manifest&url=https%3A%2F%2Fapplejr.net%2Fpost%2FB8BGPMF2XK_APPLEJR_0511ce97.plist">
      Install ESign
    </a>
    <!-- Direct IPA -->
    <a
      class="button download"
      href="https://applejr.ipadownloads.com/signed/panel/b8bgpmf2xk_applejr-93d4898e.ipa"
      download>
      Save IPA to Files
    </a>
    <div class="note">
      The Install button uses the same AppleJr installation
      manifest as the original HSBC installation page.
    </div>
  </div>
</body>
</html>
